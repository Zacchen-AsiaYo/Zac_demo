  <style>

      }
    }

    @media (max-width: 640px) {
      .seb-hide-mobile {
        display: none !important;
      }
    }

    /* Banner */
    .seb-banner-arrow:hover {
      background: #fff !important;
      box-shadow: 0 4px 8px rgba(0, 0, 0, .12) !important;
    }

    .seb-banner-dot {
      transition: all 200ms;
    }

    /* Tabs */
    .seb-main-tab {
      transition: color 150ms, background 150ms, border-color 150ms;
    }

    .seb-main-tab:hover {
      color: var(--ay-cp-primary-5);
    }

    .seb-region-pill {
      transition: all 150ms;
    }

    .seb-region-pill:hover {
      border-color: var(--ay-cp-primary-5);
      color: var(--ay-cp-primary-5);
    }

    .seb-chip {
      transition: all 150ms;
      user-select: none;
    }

    .seb-chip:hover {
      border-color: var(--ay-cp-primary-5);
    }

    .seb-tab-scroller::-webkit-scrollbar {
      display: none;
    }

    /* Card */
    .seb-card {
      transition: box-shadow 200ms, transform 200ms;
    }

    .seb-card:hover {
      box-shadow: 0 8px 16px rgba(0, 0, 0, .10);
      transform: translateY(-2px);
    }

    .seb-card-soldout {
      filter: saturate(.4);
    }

    .seb-faq-item {
      transition: background 150ms;
    }

    .seb-faq-item:hover {
      background: var(--ay-neutral-1);
    }

    /* fade-in for filtered results */
    @keyframes seb-fade-in {
      from {
        opacity: 0;
        transform: translateY(8px);
      }

      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .seb-fade-in {
      animation: seb-fade-in 240ms ease both;
    }

    /* Image placeholders */
    .seb-img {
      background-size: cover;
      background-position: center;
      position: relative;
    }

    .seb-img::after {
      content: '';
      position: absolute;
      inset: 0;
      background: linear-gradient(180deg, transparent 50%, rgba(0, 0, 0, .35) 100%);
      pointer-events: none;
    }

    .dropdown {
      position: relative;
      height: 100%;
      display: inline-flex;
      align-items: center;
    }

    .dropdown__trigger .header__caret {
      transition: transform .15s ease;
      display: inline-block;
    }

    .dropdown[data-open="true"] .header__caret {
      transform: rotate(180deg);
    }

    .dropdown__menu {
      position: absolute;
      top: calc(100% - 4px);
      right: 0;
      background: #fff;
      border-radius: 8px;
      box-shadow: 0 4px 16px rgba(0, 0, 0, .14);
      min-width: 160px;
      padding: 8px 0;
      z-index: 200;
      display: none;
    }

    .dropdown[data-open="true"] .dropdown__menu {
      display: block;
    }

    .dropdown__item {
      display: flex;
      align-items: center;
      gap: 10px;
      width: 100%;
      text-align: left;
      padding: 12px 24px;
      font-size: 16px;
      font-weight: 500;
      color: #262626;
      background: none;
      border: none;
      cursor: pointer;
      white-space: nowrap;
      text-decoration: none;
      line-height: 1.5;
      box-sizing: border-box;
    }

    .dropdown__flag {
      width: 28px;
      height: 20px;
      object-fit: cover;
      flex-shrink: 0;
      display: block;
    }

    .dropdown__item:hover {
      background: #f5f5f5;
    }

    .dropdown__item--active {
      color: #1e9fd2;
    }

    /* Currency dropdown — proto-only badge & tooltip */
    .seb-proto-tip {
      position: relative;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 16px;
      height: 16px;
      border-radius: 50%;
      background: #e8e8e8;
      color: #595959;
      font-size: 11px;
      font-weight: 700;
      cursor: default;
      margin-left: 4px;
      line-height: 1;
      flex-shrink: 0;
    }
    .seb-proto-tip::after {
      content: attr(data-tip);
      position: absolute;
      top: calc(100% + 6px);
      left: 50%;
      transform: translateX(-50%);
      background: #262626;
      color: #fff;
      font-size: 12px;
      font-weight: 400;
      white-space: nowrap;
      padding: 5px 10px;
      border-radius: 4px;
      pointer-events: none;
      opacity: 0;
      transition: opacity 0.15s;
      z-index: 300;
    }
    .seb-proto-tip:hover::after {
      opacity: 1;
    }

    .dropdown__item--disabled {
      color: #bfbfbf;
      cursor: not-allowed;
      pointer-events: none;
    }
    .dropdown__item--disabled:hover {
      background: none;
    }

    // Shared primitives for CP kit — mirror ui-library styled patterns

    const Button = ({ children, level = 'primary', styleType = 'solid', size = 'md', iconName, onClick, disabled, style = {}, ...rest }) => {
      const sizes = {
        sm: { fs: 14, lh: 20, pad: '5px 16px', icon: 14 },
        md: { fs: 16, lh: 24, pad: '7px 20px', icon: 16 },
        lg: { fs: 16, lh: 24, pad: '11px 24px', icon: 18 },

      const s = sizes[size];
      const palette = {
        primary: {
          solid: { bg: '#1e9fd2', hover: '#0f7aab', color: '#fff', border: '#1e9fd2' },
          outline: { bg: '#fff', hover: '#f0fdff', color: '#1e9fd2', border: '#1e9fd2' },
          flat: { bg: 'transparent', hover: 'rgba(30,159,210,.08)', color: '#1e9fd2', border: 'transparent' }
        },
        neutral: {
          solid: { bg: '#bfbfbf', hover: '#8c8c8c', color: '#fff', border: '#bfbfbf' },
          outline: { bg: '#fff', hover: '#f5f5f5', color: '#595959', border: '#bfbfbf' },
          flat: { bg: 'transparent', hover: '#f5f5f5', color: '#595959', border: 'transparent' }

        danger: {
          solid: { bg: '#f4511e', hover: '#cf350e', color: '#fff', border: '#f4511e' },
          outline: { bg: '#fff', hover: '#fff3eb', color: '#f4511e', border: '#f4511e' },
          flat: { bg: 'transparent', hover: 'rgba(244,81,30,.08)', color: '#f4511e', border: 'transparent' }
        },
      };
      const p = (palette[level] || palette.primary)[styleType];
      const [hover, setHover] = React.useState(false);
      return (
        <button onClick={onClick} disabled={disabled}
          onMouseEnter={() => setHover(true)} onMouseLeave={() => setHover(false)}
          style={{
            display: 'inline-flex', alignItems: 'center', justifyContent: 'center', gap: 6,
            fontFamily: 'var(--ay-font-sans)', fontWeight: 500, cursor: disabled ? 'not-allowed' : 'pointer',
            fontSize: s.fs, lineHeight: s.lh + 'px', padding: s.pad,
            border: `1px solid ${p.border}`, borderRadius: 4,
            background: hover && !disabled ? p.hover : p.bg, color: p.color,
            opacity: disabled ? 0.48 : 1, transition: 'background-color 150ms, color 150ms',
            ...style,

          {iconName && <span className="ay-icon ay-icon-line" style={{ fontSize: s.icon }} dangerouslySetInnerHTML={{ __html: iconName }} />}

    const IconButton = ({ code, onClick, shape = 'circular', size = 40, level = 'neutral', style = {} }) => {
      const [hover, setHover] = React.useState(false);
      const bg = level === 'primary' ? (hover ? '#0f7aab' : '#1e9fd2') : (hover ? '#f5f5f5' : 'transparent');
      const color = level === 'primary' ? '#fff' : '#595959';
      return (
        <button onClick={onClick}
          onMouseEnter={() => setHover(true)} onMouseLeave={() => setHover(false)}
          style={{
            width: size, height: size, display: 'inline-flex', alignItems: 'center', justifyContent: 'center',
            borderRadius: shape === 'circular' ? 100 : 4, border: '1px solid transparent',
            background: bg, color, cursor: 'pointer', fontSize: 20,
            transition: 'background 150ms', ...style,
          }}>
          <span className="ay-icon ay-icon-line" dangerouslySetInnerHTML={{ __html: code }} />
        </button>
      );
    };

    const Tag = ({ children, type = 'primary', styleType = 'outline', size = 'medium' }) => {
      const pal = {
        primary: { outline: { bg: '#f0fdff', border: '#1e9fd2', color: '#1e9fd2' }, solid: { bg: '#055885', border: '#055885', color: '#fff' } },
        success: { outline: { bg: '#efffef', border: '#04ad00', color: '#04ad00' }, solid: { bg: '#016628', border: '#016628', color: '#fff' } },
        warning: { outline: { bg: '#fffce6', border: '#ffb300', color: '#d99100' }, solid: { bg: '#d99100', border: '#d99100', color: '#fff' } },
        danger: { outline: { bg: '#fff3eb', border: '#f4511e', color: '#f4511e' }, solid: { bg: '#a81f03', border: '#a81f03', color: '#fff' } },
        neutral: { outline: { bg: '#f5f5f5', border: '#bfbfbf', color: '#595959' }, solid: { bg: '#262626', border: '#262626', color: '#fff' } },
      };
      const sizes = { small: { fs: 12, lh: '16px', pad: '4px' }, medium: { fs: 14, lh: '20px', pad: '4px 8px' }, large: { fs: 16, lh: '24px', pad: '4px 8px' } };
      const p = pal[type][styleType]; const s = sizes[size];
      return <span style={{ display: 'inline-block', border: `1px solid ${p.border}`, background: p.bg, color: p.color, padding: s.pad, borderRadius: 4, fontSize: s.fs, lineHeight: s.lh }}>{children}</span>;
    };

    const TextField = ({ label, value, onChange, placeholder, iconCode, status = 'default', message, type = 'text', style = {} }) => {
      const statusColor = { default: '#bfbfbf', error: '#f4511e', success: '#04ad00', focus: '#1e9fd2' }[status] || '#bfbfbf';
      const [focus, setFocus] = React.useState(false);
      return (
        <div style={{ display: 'flex', flexDirection: 'column', gap: 6, ...style }}>
          {label && <label style={{ fontSize: 12, color: '#595959', fontWeight: 500 }}>{label}</label>}
          <div style={{
            display: 'flex', alignItems: 'center',
            border: `1px solid ${focus ? '#1e9fd2' : statusColor}`, borderRadius: 4, background: '#fff',
            boxShadow: focus ? '0 0 0 2px rgba(30,159,210,.48)' : 'none',
          }}>
            {iconCode && <span className="ay-icon ay-icon-line" style={{ paddingLeft: 8, color: '#1e9fd2', fontSize: 18 }} dangerouslySetInnerHTML={{ __html: iconCode }} />}
            <input type={type} value={value} onChange={onChange} placeholder={placeholder}
              onFocus={() => setFocus(true)} onBlur={() => setFocus(false)}
              style={{ flex: 1, border: 'none', outline: 'none', padding: '10px 8px', fontSize: 14, lineHeight: '20px', color: '#595959', fontFamily: 'inherit', background: 'transparent' }} />
          </div>
          {message && <div style={{ fontSize: 12, color: status === 'error' ? '#f4511e' : '#8c8c8c' }}>{message}</div>}
        </div>
      );
    };

    const Stepper = ({ value, onChange, min = 0, max = 20, label, sublabel }) => (
      <div style={{ display: 'flex', alignItems: 'center', justifyContent: 'space-between', padding: '12px 0' }}>
        <div>
          <div style={{ fontSize: 14, fontWeight: 500, color: '#262626' }}>{label}</div>
          {sublabel && <div style={{ fontSize: 12, color: '#8c8c8c', marginTop: 2 }}>{sublabel}</div>}
        </div>
        <div style={{ display: 'flex', alignItems: 'center', gap: 12 }}>
          <button disabled={value <= min} onClick={() => onChange(Math.max(min, value - 1))}
            style={{ width: 32, height: 32, borderRadius: 100, border: '1px solid #bfbfbf', background: '#fff', cursor: value <= min ? 'not-allowed' : 'pointer', opacity: value <= min ? 0.48 : 1, fontSize: 18, lineHeight: 0, color: '#595959' }}>−</button>
          <div style={{ minWidth: 24, textAlign: 'center', fontSize: 14, color: '#262626', fontWeight: 500 }}>{value}</div>
          <button disabled={value >= max} onClick={() => onChange(Math.min(max, value + 1))}
            style={{ width: 32, height: 32, borderRadius: 100, border: '1px solid #1e9fd2', background: '#fff', color: '#1e9fd2', cursor: value >= max ? 'not-allowed' : 'pointer', opacity: value >= max ? 0.48 : 1, fontSize: 18, lineHeight: 0 }}>+</button>
        </div>
      </div>
    );

    const Checkbox = ({ checked, onChange, label, disabled }) => (
      <label style={{ display: 'inline-flex', alignItems: 'flex-start', gap: 8, cursor: disabled ? 'not-allowed' : 'pointer', color: disabled ? '#bfbfbf' : '#595959', fontSize: 14, lineHeight: '20px', opacity: disabled ? 0.8 : 1 }}>
        <span style={{ width: 16, height: 16, flexShrink: 0, borderRadius: 4, border: checked ? 'none' : '1px solid #bfbfbf', background: checked ? '#1e9fd2' : '#fff', display: 'inline-flex', alignItems: 'center', justifyContent: 'center', color: '#fff', fontSize: 12, marginTop: 2 }}>{checked ? '✓' : ''}</span>
        <span>{label}</span>
        <input type="checkbox" checked={checked} onChange={e => !disabled && onChange(e.target.checked)} style={{ display: 'none' }} />
      </label>
    );

    const Badge = ({ count, dot, children }) => (
      <span style={{ position: 'relative', display: 'inline-block' }}>
        {children}
        {dot ? (
          <span style={{ position: 'absolute', top: -2, right: -2, width: 8, height: 8, borderRadius: 8, background: '#f4511e', boxShadow: '0 0 0 2px #fff' }} />
        ) : count ? (
          <span style={{ position: 'absolute', top: -6, right: -6, minWidth: 16, height: 16, padding: '0 4px', borderRadius: 8, background: '#f4511e', color: '#fff', fontSize: 12, lineHeight: '16px', textAlign: 'center', boxSizing: 'border-box' }}>{count > 99 ? '99+' : count}</span>
        ) : null}
      </span>
    );

    const BadgeRating = ({ score, count, size = 'medium' }) => {
      const fs = size === 'small' ? 12 : size === 'large' ? 18 : 14;
      const comment = score >= 4.5 ? '極佳 · Excellent' : score >= 4 ? '很好 · Very good' : score >= 3.5 ? '好 · Good' : '一般';
      return (
        <span style={{ display: 'inline-flex', alignItems: 'center', gap: 6, fontSize: fs, color: '#262626' }}>
          <span style={{ background: '#055885', color: '#fff', borderRadius: 4, padding: '2px 6px', fontWeight: 700 }}>{score.toFixed(1)}</span>
          <span style={{ color: '#595959', fontWeight: 500 }}>{comment}</span>
          {count && <span style={{ color: '#8c8c8c' }}>({count.toLocaleString()})</span>}
        </span>
      );
    };

    // Placeholder image component — deterministic gradient backgrounds
    const PlaceholderImg = ({ seed = 'a', height = 160, style = {}, label }) => {
      const palettes = [
        ['#1e9fd2', '#6ccfeb'], ['#f4511e', '#ffbb99'], ['#20AEA1', '#63CBC2'],
        ['#455a64', '#90a4ae'], ['#ffb300', '#ffd752'], ['#055885', '#43b7de'],
      ];
      let h = 0; for (const c of String(seed)) h = (h * 31 + c.charCodeAt(0)) | 0;
      const [a, b] = palettes[Math.abs(h) % palettes.length];
      return (
        <div style={{ background: `linear-gradient(135deg, ${a}, ${b})`, height, borderRadius: 8, display: 'flex', alignItems: 'flex-end', padding: 10, color: 'rgba(255,255,255,.9)', fontSize: 11, fontWeight: 500, ...style }}>
          {label}
        </div>
      );
    };

    Object.assign(window, { Button, IconButton, Tag, TextField, Stepper, Checkbox, Badge, BadgeRating, PlaceholderImg });

  </script>

  <script type="text/babel" data-presets="env,react">
    // SEB v4— Unsplash image override
    //
    // Loads AFTER data.jsx and replaces every event's `img` field with a curated
    // Unsplash photo that matches the event's category (marathon / cycling / golf /
    // baseball / mountain / oneday-tour). Banner backgrounds are also swapped.
    //
    // Selection is deterministic — we hash the event id into the appropriate pool
    // so the same event always gets the same photo across reloads.

    (function applyUnsplashImages() {
      // Curated pools — Unsplash photo IDs that read clearly at 4:3/ 16:9thumb size.
      // All photos selected for: clear subject, good crop, marathon/sport related.
      const POOLS = {
        marathon: [
          'photo-1530549387789-4c1017266635', // runners on road, blurred motion
          'photo-1571008887538-b36bb32f4571', // marathon crowd
          'photo-1571902943202-507ec2618e8f', // runners stadium
          'photo-1486218119243-13883505764c', // single runner sunset
          'photo-1452626038306-9aae5e071dd3', // running shoes start line
          'photo-1532444458054-01a7dd3e9fca', // city marathon crowd
          'photo-1517649763962-0c623066013b', // running silhouette
          'photo-1476480862126-209bfaa8edc8', // race start
          'photo-1542401886-65d6c61db217', // running on bridge
          'photo-1502904550040-7534597429ae', // marathon street
          'photo-1551739440-5dd934d3a94a', // runner action
          'photo-1452626038306-9aae5e071dd3', // running road
          'photo-1502904550040-7534597429ae', // runners crowd
          'photo-1543470373-e055b73a8f29', // marathon medal
          'photo-1461896836934-ffe607ba8211', // racing bib
          'photo-1486218119243-13883505764c', // sunset run
          'photo-1486218119243-13883505764c',
        ],
        cycling: [
          'photo-1502602898657-3e91760cbb34', // cyclist city
          'photo-1517649763962-0c623066013b', // cyclist scenic
          'photo-1541625602330-2277a4c46182', // road cycling
          'photo-1485965120184-e220f721d03e', // bike on road
          'photo-1571068316344-75bc76f77890', // cyclist hills
          'photo-1473445730015-841f29a9490b', // cycling group
          'photo-1517524008697-84bbe3c3fd98', // road bike close
          'photo-1532635241-17e820acc59f',    // cyclist mountain
          'photo-1494522855154-9297ac14b55f', // tour de france style
          'photo-1556316384-12c35d30afa4',    // single cyclist road
        ],
        golf: [
          'photo-1535131749006-b7f58c99034b', // golf green
          'photo-1587174486073-ae5e5cff23aa', // golf course aerial
          'photo-1592919505780-303950717480', // golfer swing
          'photo-1535132011086-b8818f016104', // golf course wide
          'photo-1587386237706-23e3eed95b18', // golf cart course
          'photo-1591491653056-4e0f9f3c1d96', // golfer putting
          'photo-1571019613454-1cb2f99b2d8b', // golf club close
          'photo-1611374243809-7f3e1f4c8f5c', // golf flag green
        ],
        baseball: [
          'photo-1566577739112-5180d4bf9390', // baseball stadium
          'photo-1508344928-30feb2e1f9a8',    // baseball player
          'photo-1521122807175-50e5d2cc6cdf', // baseball field
          'photo-1531415074968-036ba1b575da', // baseball game
          'photo-1471017432319-77a5cea6f1da', // koshien style stadium
          'photo-1607604276583-eef5d076aa5f', // baseball ball glove
        ],
        mountain: [
          'photo-1490806843957-31f4c9a91c65', // hiker mountain
          'photo-1551632811-561732d1e306',    // mountain climb
          'photo-1483728642387-6c3bdd6c93e5', // mountain summit
          'photo-1464822759023-fed622ff2c3b', // hiker view
          'photo-1551524559-8af4e6624178',    // ski mountain
          'photo-1517649763962-0c623066013b', // climber
          'photo-1454496522488-7a8e488e8606', // mountain hike
          'photo-1469854523086-cc02fe5d8800', // alps
        ],
        triathlon: [
          'photo-1530143584546-02191bc84eb5', // triathlon swim
          'photo-1530549387789-4c1017266635', // triathlon run
          'photo-1571019613454-1cb2f99b2d8b', // bike transition
          'photo-1505672984891-69e5d5a55cad', // open water swim
        ],
        oneday: [
          'photo-1545569341-9eb8b30979d9',    // taiwan/japan landscape
          'photo-1493780474015-ba834fd0ce2f', // bus tour
          'photo-1480796927426-f609979314bd', // travel
          'photo-1528127269322-539801943592', // city tour
          'photo-1542931287-023b922fa89b',    // package tour
        ],
      };

      // Hero banners
      const BANNER_POOL = [
        'photo-1452626038306-9aae5e071dd3?w=1600&q=80',
        'photo-1486218119243-13883505764c?w=1600&q=80',
        'photo-1532444458054-01a7dd3e9fca?w=1600&q=80',
        'photo-1502904550040-7534597429ae?w=1600&q=80',
      ];

      const url = (id) => `https://images.unsplash.com/${id}?w=1200&q=80&auto=format&fit=crop`;
      const bannerUrl = (id) => `https://images.unsplash.com/${id.includes('?') ? id : id + '?w=1600&q=80'}&auto=format&fit=crop`;

      // Deterministic hash → small int
      const hash = (s) => {
        let h = 0;
        for (let i = 0; i < s.length; i++) h = (h * 31 + s.charCodeAt(i)) | 0;
        return Math.abs(h);
      };

      // Pick a pool for a given event by inspecting raw_id tokens
      const poolForEvent = (e) => {
        const tags = (e.raw_id || []).join(' ').toLowerCase();
        if (/baseball/.test(tags)) return POOLS.baseball;
        if (/golf/.test(tags)) return POOLS.golf;
        if (/bike|cycle/.test(tags)) return POOLS.cycling;
        if (/mountain/.test(tags)) return POOLS.mountain;
        if (/triathlon|ironman/.test(tags)) return POOLS.triathlon;
        if (/oneday|tour/.test(tags)) return POOLS.oneday;
        // Heuristic fallback by title keywords
        const t = (e.title || '').toLowerCase();
        if (/golf|Golf/.test(t)) return POOLS.golf;
        if (/棒球|baseball|甲子園/.test(t)) return POOLS.baseball;
        if (/Cycling|Bicycle|bike|cycle|bicycle/.test(t)) return POOLS.cycling;
        if (/Hiking|爬|hike|climb|trek/.test(t)) return POOLS.mountain;
        if (/鐵人|triathlon|ironman/.test(t)) return POOLS.triathlon;
        if (/Chartered Car|Day Tour|day tour/.test(t)) return POOLS.oneday;
        return POOLS.marathon;
      };

      const pickFromPool = (pool, key) => pool[hash(key) % pool.length];

      const overrideEvent = (e) => {
        if (!e || !e.id) return;
        const pool = poolForEvent(e);
        const photoId = pickFromPool(pool, e.id);
        e.img = url(photoId);
      };

      // 1) Override flat SEB_EVENTS list
      if (Array.isArray(window.SEB_EVENTS)) {
        window.SEB_EVENTS.forEach(overrideEvent);
      }

      // 2) Override embedded copies inside SEB_TAB_CONFIG[*].sections[*].events
      const cfg = window.SEB_TAB_CONFIG;
      if (cfg && typeof cfg === 'object') {
        Object.values(cfg).forEach(tab => {
          (tab.sections || []).forEach(sec => {
            (sec.events || []).forEach(overrideEvent);
          });
        });
      }

      // 3) Override coming-soon events too
      if (Array.isArray(window.SEB_COMING_SOON)) {
        window.SEB_COMING_SOON.forEach(overrideEvent);
      }

      // 4) Banner background images
      if (Array.isArray(window.SEB_BANNERS)) {
        window.SEB_BANNERS.forEach((b, i) => {
          const id = BANNER_POOL[i % BANNER_POOL.length].split('?')[0];
          b.bg = `https://images.unsplash.com/${id}?w=1600&q=80&auto=format&fit=crop`;
        });
      }
    })();

  </script>

          </span>
          {(() => {
            const cur = window.__sebCurrency || 'USD';
            const setCur = window.__sebSetCurrency || (() => {});
            const allOpts = [
              { key: 'JPY', label: 'JPY' },
              { key: 'KRW', label: 'KRW' },
              { key: 'TWD', label: 'TWD' },
              { key: 'THB', label: 'THB' },
              { key: 'USD', label: 'USD' },
              { key: 'HKD', label: 'HKD' },
              { key: 'MYR', label: 'MYR' },
              { key: 'RMB', label: 'RMB' },
              { key: 'SGD', label: 'SGD' },
            ];
            const supported = ['TWD', 'USD', 'RMB'];
            return (
              <div className="dropdown seb-hide-mobile" data-dropdown="currency" data-open="false">
                <span className="dropdown__trigger" aria-expanded="false" style={{ display: 'inline-flex', alignItems: 'center', gap: 4, color: '#262626', fontSize: 14, cursor: 'pointer' }}>

                  <span className="ay-icon ay-icon-line header__caret" style={{ fontSize: 16 }}>expand_more</span>
                </span>
                <div className="dropdown__menu" role="menu" hidden>
                  {allOpts.map(o => {
                    const active = cur === o.key;
                    const disabled = !supported.includes(o.key);
                    return (
                      <button key={o.key}
                        className={`dropdown__item${active ? ' dropdown__item--active' : ''}${disabled ? ' dropdown__item--disabled' : ''}`}
                        data-value={o.key}
                        onClick={disabled ? undefined : () => setCur(o.key)}
                        title={disabled ? 'Prototype only supports USD / RMB conversion' : ''}
                      >{o.label}</button>
                    );
                  })}
                </div>
              </div>
            );

  <script type="text/babel" data-presets="env,react">
    // Banner carousel — promo hero, takes over hero spot

    const { useState: useStateBanner, useEffect: useEffectBanner } = React;

    const Banner = () => {
      const [idx, setIdx] = useStateBanner(0);
      const [paused, setPaused] = useStateBanner(false);
      const banners = window.SEB_BANNERS;

      useEffectBanner(() => {
        if (paused) return;
        const t = setTimeout(() => setIdx((idx + 1) % banners.length), 5500);
        return () => clearTimeout(t);
      }, [idx, paused]);

      const go = (n) => setIdx((n + banners.length) % banners.length);

      return (
        <section
          style={{ background: '#fff' }}
          onMouseEnter={() => setPaused(true)}
          onMouseLeave={() => setPaused(false)}
        >
          <div style={{ position: 'relative', width: '100%', overflow: 'hidden', height: 'var(--seb-banner-h)' }}>
            {banners.map((b, i) => {
              const Wrap = b.href ? 'a' : 'div';
              const wrapProps = b.href ? { href: b.href, target: '_blank', rel: 'noopener' } : {};
              return (
                <Wrap
                  key={i}
                  {...wrapProps}
                  className="seb-img"
                  style={{
                    position: 'absolute', inset: 0,
                    backgroundImage: `url(${b.bg})`,
                    backgroundSize: 'cover', backgroundPosition: 'center',
                    opacity: i === idx ? 1 : 0,
                    transition: 'opacity 600ms ease',
                    pointerEvents: i === idx ? 'auto' : 'none',
                    cursor: b.href ? 'pointer' : 'default',
                    display: 'block',
                  }}
                >
                  {/* Overlay text only if a title is provided */}
                  {b.title && (
                    <React.Fragment>
                      <div style={{ position: 'absolute', inset: 0, background: 'linear-gradient(95deg, rgba(0,33,56,.78) 0%, rgba(0,33,56,.45) 45%, rgba(0,33,56,.05) 80%)' }} />
                      <div style={{ position: 'absolute', inset: 0, maxWidth: '100%', margin: '0 auto', padding: '40px var(--seb-pad)', display: 'flex', flexDirection: 'column', justifyContent: 'center', color: '#fff' }}>
                        <div style={{ maxWidth: 560 }}>
                          <div style={{ fontSize: 'var(--seb-banner-title)', lineHeight: 1.15, fontWeight: 700, letterSpacing: '-0.01em', marginBottom: 12, textShadow: '0 2px 8px rgba(0,0,0,.2)' }}>{b.title}</div>
                          {b.subtitle && <div style={{ fontSize: 'var(--seb-banner-sub)', lineHeight: 1.5, opacity: 0.95, maxWidth: 480 }}>{b.subtitle}</div>}
                        </div>
                      </div>
                    </React.Fragment>
                  )}
                </Wrap>
              );
            })}

            {/* prev/next arrows */}
            <button
              className="seb-banner-arrow"
              onClick={() => go(idx - 1)}
              style={{ position: 'absolute', left: 16, top: '50%', transform: 'translateY(-50%)', width: 44, height: 44, borderRadius: 100, border: 'none', background: 'rgba(255,255,255,.85)', cursor: 'pointer', display: 'inline-flex', alignItems: 'center', justifyContent: 'center', color: '#262626' }}>
              <span className="ay-icon ay-icon-line" style={{ fontSize: 22 }}>chevron_left</span>
            </button>
            <button
              className="seb-banner-arrow"
              onClick={() => go(idx + 1)}
              style={{ position: 'absolute', right: 16, top: '50%', transform: 'translateY(-50%)', width: 44, height: 44, borderRadius: 100, border: 'none', background: 'rgba(255,255,255,.85)', cursor: 'pointer', display: 'inline-flex', alignItems: 'center', justifyContent: 'center', color: '#262626' }}>
              <span className="ay-icon ay-icon-line" style={{ fontSize: 22 }}>chevron_right</span>
            </button>

            {/* dots */}
            <div style={{ position: 'absolute', bottom: 20, left: '50%', transform: 'translateX(-50%)', display: 'flex', gap: 8 }}>
              {banners.map((_, i) => (
                <span
                  key={i}
                  className="seb-banner-dot"
                  onClick={() => go(i)}
                  style={{
                    width: i === idx ? 28 : 8, height: 8, borderRadius: 100,
                    background: i === idx ? '#fff' : 'rgba(255,255,255,.5)',
                    cursor: 'pointer',
                  }}
                />
              ))}
            </div>
          </div>
        </section>
      );
    };

    Object.assign(window, { Banner });

  </script>
  <script type="text/babel" data-presets="env,react">
    // SEB v4FilterBar — three-tier nav
    //
    //   Tier 1: mainTab (top-level category)        — non-sticky
    //   Tier 2: secondTab (anchor nav per-mainTab)  — sticky under site header
    //
    // secondTab clicks smooth-scroll to the matching <Section>. Active state
    // is driven by scroll-spy: as the user scrolls, whichever section is
    // closest to the viewport top wins. Sections themselves render below.

    const FilterBarV4 = ({ mainTab, setMainTab, activeSection, onSecondTabClick, sectionRefs }) => {
      const mainTabs = window.SEB_MAIN_TABS;
      const config = window.SEB_TAB_CONFIG[mainTab];
      const secondTabs = config?.secondTabs || [];

      const mainScrollerRef = React.useRef(null);
      const secondScrollerRef = React.useRef(null);
      const sentinelRef = React.useRef(null);
      const [stuck, setStuck] = React.useState(false);
      const [mainScroll, setMainScroll] = React.useState({ canL: false, canR: false });

      // Track main strip scroll bounds so we can enable/disable arrow buttons
      React.useEffect(() => {
        const el = mainScrollerRef.current;
        if (!el) return;
        const update = () => {
          setMainScroll({
            canL: el.scrollLeft > 4,
            canR: el.scrollLeft + el.clientWidth < el.scrollWidth - 4,
          });
        };
        update();
        el.addEventListener('scroll', update, { passive: true });
        window.addEventListener('resize', update);
        return () => {
          el.removeEventListener('scroll', update);
          window.removeEventListener('resize', update);
        };
      }, []);

      const scrollMain = (dir) => {
        const el = mainScrollerRef.current;
        if (!el) return;
        el.scrollBy({ left: dir * Math.max(280, el.clientWidth * 0.7), behavior: 'smooth' });
      };

      // Sticky detection for secondTab bar
      React.useEffect(() => {
        const el = sentinelRef.current;
        if (!el || !('IntersectionObserver' in window)) return;
        const io = new IntersectionObserver(
          ([entry]) => setStuck(!entry.isIntersecting),
          { rootMargin: '-60px 0px 0px 0px', threshold: 0 }
        );
        io.observe(el);
        return () => io.disconnect();
      }, []);

      // Auto-scroll the secondTab strip so the active tab stays in view
      React.useEffect(() => {
        if (!activeSection || !secondScrollerRef.current) return;
        const tabEl = secondScrollerRef.current.querySelector(`[data-stab="${activeSection}"]`);
        if (tabEl) {
          const scroller = secondScrollerRef.current;
          const tabRect = tabEl.getBoundingClientRect();
          const scrollerRect = scroller.getBoundingClientRect();
          const offset = tabRect.left - scrollerRect.left - scrollerRect.width / 2 + tabRect.width / 2;
          scroller.scrollBy({ left: offset, behavior: 'smooth' });
        }
      }, [activeSection]);

      return (
        <React.Fragment>
          {/* ===== Tier 1: mainTab — NOT sticky ===== */}
          <section style={{
            background: '#fafafa',
            borderBottom: '1px solid #f0f0f0',
            padding: '16px 0',
          }}>
            <div style={{ position: 'relative', margin: '0 var(--seb-pad)' }}>
              {/* Left arrow */}
              <button
                onClick={() => scrollMain(-1)}
                disabled={!mainScroll.canL}
                aria-label="向左捲動"
                style={{
                  position: 'absolute', left: -16, top: '50%', transform: 'translateY(-50%)',
                  zIndex: 2,
                  width: 36, height: 36, borderRadius: '50%',
                  background: '#fff', border: '1px solid #e8e8e8',
                  boxShadow: '0 2px 8px rgba(0,0,0,.08)',
                  cursor: mainScroll.canL ? 'pointer' : 'not-allowed',
                  opacity: mainScroll.canL ? 1 : 0,
                  transition: 'opacity .2s ease',
                  display: 'inline-flex', alignItems: 'center', justifyContent: 'center',
                  fontFamily: 'inherit', color: '#262626',
                  pointerEvents: mainScroll.canL ? 'auto' : 'none',
                }}>
                <span className="ay-icon ay-icon-line" style={{ fontSize: 22 }}>chevron_left</span>
              </button>
              {/* Right arrow */}
              <button
                onClick={() => scrollMain(1)}
                disabled={!mainScroll.canR}
                aria-label="向右捲動"
                style={{
                  position: 'absolute', right: -16, top: '50%', transform: 'translateY(-50%)',
                  zIndex: 2,
                  width: 36, height: 36, borderRadius: '50%',
                  background: '#fff', border: '1px solid #e8e8e8',
                  boxShadow: '0 2px 8px rgba(0,0,0,.08)',
                  cursor: mainScroll.canR ? 'pointer' : 'not-allowed',
                  opacity: mainScroll.canR ? 1 : 0,
                  transition: 'opacity .2s ease',
                  display: 'inline-flex', alignItems: 'center', justifyContent: 'center',
                  fontFamily: 'inherit', color: '#262626',
                  pointerEvents: mainScroll.canR ? 'auto' : 'none',
                }}>
                <span className="ay-icon ay-icon-line" style={{ fontSize: 22 }}>chevron_right</span>
              </button>

              <div
                ref={mainScrollerRef}
                className="seb-tab-scroller"
                style={{
                  display: 'flex', gap: 10, overflowX: 'auto', scrollBehavior: 'smooth',
                  scrollbarWidth: 'none', msOverflowStyle: 'none',
                }}>
                {mainTabs.map(t => {
                  const active = mainTab === t.key;
                  return (
                    <button
                      key={t.key}
                      onClick={() => setMainTab(t.key)}
                      className="seb-main-tab"
                      style={{
                        position: 'relative',
                        background: active ? '#1e9fd2' : '#fff',
                        border: `1.5px solid ${active ? '#1e9fd2' : '#e8e8e8'}`,
                        borderRadius: stuck ? 100 : 8,
                        padding: stuck ? '8px 16px' : '14px 20px 12px',
                        cursor: 'pointer',
                        color: active ? '#fff' : '#262626',
                        fontFamily: 'inherit',
                        display: 'flex',
                        flexDirection: stuck ? 'row' : 'column',
                        alignItems: 'center', justifyContent: 'center',
                        gap: stuck ? 0 : 6,
                        whiteSpace: 'nowrap', flex: '0 0 auto',
                        minWidth: stuck ? 0 : 130,
                        boxShadow: active && !stuck ? '0 4px 12px rgba(30,159,210,.28)' : (active ? '0 2px 6px rgba(30,159,210,.2)' : '0 1px 2px rgba(0,0,0,.04)'),
                        transition: 'padding .2s ease, border-radius .2s ease',
                      }}>
                      {stuck ? (
                        <span className={`ay-icon ${active ? 'ay-icon-solid' : 'ay-icon-line'}`}
                          style={{ fontSize: 18, color: active ? '#fff' : '#1e9fd2', marginRight: 6 }}>{t.icon}</span>
                      ) : (
                        <span className={`ay-icon ${active ? 'ay-icon-solid' : 'ay-icon-line'}`}
                          style={{ fontSize: 30, color: active ? '#fff' : '#1e9fd2' }}>{t.icon}</span>
                      )}
                      <span style={{ fontSize: stuck ? 14 : 15, fontWeight: active ? 700 : 500 }}>{t.label}</span>
                    </button>
                  );
                })}
              </div>
            </div>
          </section>

          {/* Sentinel — drives stuck state for the sticky second tab bar */}
          <div ref={sentinelRef} style={{ height: 1 }}></div>

          {/* ===== Tier 2: secondTab — sticky anchor nav (underline style, stronger active) ===== */}
          {secondTabs.length > 0 && (
            <section
              style={{
                position: 'sticky', top: 0, zIndex: 30,
                background: '#fff',
                borderBottom: '1px solid #e8e8e8',
                boxShadow: stuck ? '0 2px 8px rgba(0,0,0,.04)' : 'none',
                transition: 'box-shadow .2s ease',
              }}>
              <div
                ref={secondScrollerRef}
                className="seb-tab-scroller"
                style={{
                  margin: '0 var(--seb-pad)',
                  display: 'flex', alignItems: 'stretch', gap: 0, overflowX: 'auto',
                  scrollbarWidth: 'none', msOverflowStyle: 'none',
                }}>
                {secondTabs.map(s => {
                  const active = activeSection === s.key;
                  return (
                    <button
                      key={s.key}
                      data-stab={s.key}
                      onClick={() => onSecondTabClick(s.key)}
                      style={{
                        position: 'relative',
                        background: 'transparent',
                        border: 'none',
                        padding: '18px 22px 16px',
                        cursor: 'pointer',
                        color: active ? '#1e9fd2' : '#595959',
                        fontFamily: 'inherit',
                        fontSize: 15, fontWeight: active ? 700 : 500,
                        whiteSpace: 'nowrap', flex: '0 0 auto',
                        transition: 'color .15s ease',
                      }}>
                      {s.label}
                      {active && (
                        <span style={{
                          position: 'absolute', bottom: 0, left: 0, right: 0, height: 4,
                          background: '#1e9fd2',
                        }}></span>
                      )}
                    </button>
                  );
                })}
              </div>
            </section>
          )}
        </React.Fragment>
      );
    };

    Object.assign(window, { FilterBarV4 });

  </script>
  <script type="text/babel" data-presets="env,react">
    // Event card — curated sport event listing

    // Split headline so every ★-prefixed bullet starts on its own line.
    // Handles separators like "★A · ★B", "★A ★B", "★A、★B".
    const splitHeadline = (text) => {
      if (!text) return [];
      if (!text.includes('★')) return [text];
      // Insert a sentinel before every ★ that is not at the start, then split.
      return text
        .replace(/\s*[·、,，]?\s*★/g, '\n★')
        .split('\n')
        .map(s => s.trim())
        .filter(Boolean);
    };

    // Card-level chip metadata (icons + display labels for badges shown on cards).
    // Section-level chip filters use SEB_CHIP_LABELS; this map handles card badges.
    const _CARD_CHIP_META = {
      hot: { label: 'Best Sellers中', icon: 'local_fire_department' },
      pb: { label: '追求 PB', icon: 'speed' },
      beginner: { label: 'New手友善', icon: 'sentiment_satisfied' },
      challenge: { label: '挑戰極限', icon: 'military_tech' },
      super: { label: '超級Marathon', icon: 'bolt' },
      tour: { label: 'Chartered Car/Day Tour', icon: 'directions_bus' },
      oneday: { label: 'Day Tour', icon: 'today' },
      spring: { label: '4-6月', icon: 'local_florist' },
      summer: { label: '7-9月', icon: 'wb_sunny' },
      autumn: { label: '10-12月', icon: 'eco' },
      winter: { label: '1-3月', icon: 'ac_unit' },
      // legacy keys kept for back-compat
      top100: { label: '百大Event', icon: 'workspace_premium' },
      oncelife: { label: '一生必去', icon: 'auto_awesome' },
      stay: { label: '含Accommodation', icon: 'hotel' },
      major: { label: '世界六大', icon: 'military_tech' },
      earlybird: { label: '早鳥Discount', icon: 'schedule' },
    };
    const chipLabel = (k) => (_CARD_CHIP_META[k]?.label) || (window.SEB_CHIP_LABELS?.[k]) || k;
    const chipIcon = (k) => (_CARD_CHIP_META[k]?.icon) || 'star';

    const EventCard = ({ e }) => {
      const [imgOk, setImgOk] = React.useState(true);
      return (
        <div className="seb-card" style={{
          background: '#fff', borderRadius: 8, overflow: 'hidden',
          border: '1px solid #e8e8e8', cursor: 'pointer',
          display: 'flex', flexDirection: 'column',
          position: 'relative',
        }}>
          {/* Image */}
          <div className={'seb-img ' + (e.soldOut ? 'seb-card-soldout' : '')} style={{
            height: 200, position: 'relative',
            backgroundImage: imgOk ? `url(${e.img})` : `linear-gradient(135deg, #055885, #43b7de)`,
          }}>
            <img src={e.img} alt="" style={{ display: 'none' }} onError={() => setImgOk(false)} />
            {/* Location overlay (top-left) — dark chip style for visibility on photos */}
            {e.location && !e.soldOut && (
              <div style={{
                position: 'absolute', top: 12, left: 12,
                background: '#055885', color: '#fff',
                border: '1px solid #055885',
                borderRadius: 3, padding: '4px 9px',
                fontSize: 14, fontWeight: 600,
                letterSpacing: '0.02em',
                boxShadow: '0 2px 6px rgba(0,0,0,.2)',
              }}>
                {e.location}
              </div>
            )}
            {/* Highlighted badge (top-right) */}
            {e.badge && !e.soldOut && (
              <div style={{ position: 'absolute', top: 12, right: 12, background: '#f4511e', borderRadius: 4, padding: '5px 10px', fontSize: 12, color: '#fff', fontWeight: 700, display: 'inline-flex', alignItems: 'center', gap: 4 }}>
                <span className="ay-icon ay-icon-solid" style={{ fontSize: 14 }}>local_fire_department</span>
                {e.badge}
              </div>
            )}
          </div>

          {/* Sold-out overlay */}
          {e.soldOut && (
            <div style={{
              position: 'absolute', top: 0, left: 0, right: 0, height: 200,
              background: 'rgba(38, 38, 38, .55)', display: 'flex',
              alignItems: 'center', justifyContent: 'center', flexDirection: 'column', gap: 8,
              pointerEvents: 'none',
            }}>
              <div style={{
                padding: '8px 28px', background: '#fff', borderRadius: 4,
                color: '#262626', fontSize: 18, fontWeight: 700, letterSpacing: '0.04em',
                transform: 'rotate(-4deg)', boxShadow: '0 4px 12px rgba(0,0,0,.2)',
              }}>SOLD OUT 完售</div>
            </div>
          )}

          {/* Body */}
          <div style={{ padding: 18, display: 'flex', flexDirection: 'column', gap: 10, flex: 1 }}>
            {/* Chips — all chips show below image in one consistent color, left-aligned */}
            {/* Chips — show at most 2on the card; rest collapse to “+N” */}
            {e.chips && e.chips.length > 0 && (
              <div style={{ display: 'flex', gap: 6, flexWrap: 'wrap', justifyContent: 'flex-start' }}>
                {e.chips.slice(0, 2).map(c => (
                  <span key={c} style={{ display: 'inline-flex', alignItems: 'center', fontSize: 14, padding: '3px 7px', background: '#f0fdff', color: '#055885', borderRadius: 3, border: '1px solid #c7f7ff', fontWeight: 500 }}>
                    {chipLabel(c)}
                  </span>
                ))}
              </div>
            )}

            {/* Title */}
            <div style={{ fontSize: 20, fontWeight: 600, color: '#262626', lineHeight: 1.4, display: 'flex', alignItems: 'center' }}>
              <span style={{ display: 'inline-block', width: 10, height: 10, borderRadius: '50%', backgroundColor: '#f4511e', marginRight: 8, flexShrink: 0 }}></span>
              {e.title}
            </div>

            {/* Headline — split on ★ so each starred bullet is its own line */}
            <div style={{ fontSize: 14, color: '#595959', lineHeight: 1.55 }}>
              {splitHeadline(e.headline).map((line, i) => (
                <div key={i}>{line}</div>
              ))}
            </div>

            {/* Info block — distance / includes / price, each row icon + text */}
            <div style={{ marginTop: 6, background: '#fafafa', borderRadius: 4, padding: '12px 14px', display: 'flex', flexDirection: 'column', gap: 8 }}>
              {e.distance && (
                <div style={{ display: 'inline-flex', alignItems: 'center', gap: 6, fontSize: 14, color: '#595959' }}>
                  {!e.distance.includes('提前') && (
                    <span style={{ display: 'inline-block', width: 10, height: 10, borderRadius: '50%', backgroundColor: '#f4511e', marginRight: 2, flexShrink: 0 }}></span>
                  )}
                  <span className="ay-icon ay-icon-line" style={{ fontSize: 20 }}>straighten</span>
                  {e.distance}
                </div>
              )}
              {e.includes && (
                <div style={{ display: 'flex', gap: 6, alignItems: 'flex-start', fontSize: 14, color: '#595959', lineHeight: 1.55 }}>
                  <span className="ay-icon ay-icon-line" style={{ fontSize: 18, marginTop: 2, color: '#04ad00' }}>check_circle</span>
                  <span style={{ flex: 1 }}>{e.includes}</span>
                </div>
              )}
              <div style={{ display: 'inline-flex', alignItems: 'center', gap: 6, fontSize: 14, color: '#595959' }}>
                <span className="ay-icon ay-icon-line" style={{ fontSize: 20, color: '#f4511e' }}>sell</span>
                {(() => {
                  if (e.soldOut) return <span style={{ color: '#8c8c8c', fontWeight: 500 }}>Sold Out</span>;
                  const cfg = window.__sebCurrencyConfig || {};
                  const cur = window.__sebCurrency || 'USD';
                  const divisor = (cfg[cur] && cfg[cur].divisor) || 30;
                  const symbol = (cfg[cur] && cfg[cur].symbol) || 'USD$';
                  if (e.price) {
                    const baseTWD = e.price * 30;
                    const converted = Math.round(baseTWD / divisor);
                    return (
                      <span style={{ display: 'inline-flex', alignItems: 'baseline', gap: 4 }}>
                        <span>From</span>
                        <span style={{ color: '#f4511e', fontWeight: 600 }}>{symbol}</span>
                        <span style={{ fontWeight: 700, color: '#f4511e', letterSpacing: '-0.01em' }}>{converted.toLocaleString()}</span>
                      </span>
                    );
                  }
                  if (e.priceText) {
                    const m = e.priceText.match(/[\d,]+/);
                    if (m) {
                      const usdVal = parseFloat(m[0].replace(/,/g, ''));
                      const baseTWD = usdVal * 30;
                      const converted = Math.round(baseTWD / divisor);
                      return (
                        <span style={{ display: 'inline-flex', alignItems: 'baseline', gap: 4 }}>
                          <span>From</span>
                          <span style={{ color: '#f4511e', fontWeight: 600 }}>{symbol}</span>
                          <span style={{ fontWeight: 700, color: '#f4511e', letterSpacing: '-0.01em' }}>{converted.toLocaleString()}</span>
                        </span>
                      );
                    }
                    return <span style={{ color: '#f4511e', fontWeight: 600 }}>{e.priceText}</span>;
                  }
                  return <span style={{ color: '#595959' }}>Price on request</span>;
                })()}
              </div>
            </div>
          </div>
        </div>
      );
    };

    // Coming-soon card — same structure as EventCard, but price slot replaced with "預計 XXXX.XX.XX 開賣"
    // Bottom row keeps "XXX 人關注" + "Notification我開賣" button
    const ComingSoonCard = ({ e, onNotify, notified }) => {
      const [imgOk, setImgOk] = React.useState(true);
      return (
        <div className="seb-card" style={{
          background: '#fff', borderRadius: 8, overflow: 'hidden',
          border: '1px solid #e8e8e8', cursor: 'pointer',
          display: 'flex', flexDirection: 'column', position: 'relative',
        }}>
          {/* Image — same height as EventCard */}
          <div className="seb-img" style={{
            height: 200, position: 'relative',

  <script type="text/babel" data-presets="env,react">
    // SEB v4SectionGrid — renders one Section with heading, chip filter, and a
    // 4×2card grid (max 8cards visible). If more cards exist behind a chip
    // filter, "ShowMore (N)" reveals them; "看All →" links out to the full
    // category page.

    const SectionGrid = ({ section, mainTabKey }) => {
      const labels = window.SEB_CHIP_LABELS;
      const [chip, setChip] = React.useState(section.chips[0] || 'all');
      const [showMore, setShowMore] = React.useState(false);

      // Reset chip + showMore when section changes (defensive)
      React.useEffect(() => {
        setChip(section.chips[0] || 'all');
        setShowMore(false);
      }, [section.id]);

      // Section-level chip filter. 'all' = no filter; other chips match against
      // event.chips OR event.region OR event.type (flexible match so operators
      // can use the same chip key for any axis).
      const filtered = React.useMemo(() => {
        if (chip === 'all') return section.events;
        return section.events.filter(e =>
          (e.chips || []).includes(chip) ||
          e.region === chip ||
          e.type === chip
        );
      }, [section.events, chip]);

      const VISIBLE = 6;
      const displayed = showMore ? filtered : filtered.slice(0, VISIBLE);
      const hiddenCount = Math.max(0, filtered.length - VISIBLE);

      // Hide chips that would yield 0results — keeps the chip strip honest.
      // 'all' is always kept; everything else only appears if it matches ≥1event.
      const visibleChips = React.useMemo(() => {
        return (section.chips || []).filter(c => {
          if (c === 'all') return true;
          return section.events.some(e =>
            (e.chips || []).includes(c) ||
            e.region === c ||
            e.type === c
          );
        });
      }, [section.events, section.chips]);

      // If the active chip got hidden, snap back to first visible.
      React.useEffect(() => {
        if (!visibleChips.includes(chip)) setChip(visibleChips[0] || 'all');
      }, [visibleChips, chip]);

      return (
        <section
          id={section.id}
          data-section-id={section.id}
          style={{
            // Scroll-margin so anchor scrolling lands below sticky bars (60site + ~52secondTab)
            scrollMarginTop: 170,
            background: '#fff',
            padding: '40px var(--seb-pad) 16px',
          }}>
          <div style={{ maxWidth: '100%', margin: '0 auto' }}>

            {/* Heading row */}
            <div style={{ display: 'flex', alignItems: 'flex-end', justifyContent: 'space-between', gap: 16, marginBottom: 18, flexWrap: 'wrap' }}>
              <div>
                <h2 className="ay-h3" style={{ margin: 0, fontSize: 28, color: '#262626', letterSpacing: '-0.01em' }}>
                  {section.title}
                  <span style={{ fontSize: 15, color: '#8c8c8c', fontWeight: 500, marginLeft: 10 }}>
                    {section.events.length} 場
                  </span>
                </h2>
                {section.subtitle && (
                  <p style={{ margin: '6px 0 0', fontSize: 14, color: '#595959' }}>{section.subtitle}</p>
                )}
              </div>

            </div>

            {/* Chip strip */}
            {visibleChips.length > 1 && (
              <div style={{ display: 'flex', gap: 8, flexWrap: 'wrap', marginBottom: 20 }}>
                {visibleChips.map(c => {
                  const active = chip === c;
                  return (
                    <button
                      key={c}
                      onClick={() => { setChip(c); setShowMore(false); }}
                      className="seb-chip"
                      style={{
                        padding: '7px 16px', borderRadius: 100,
                        border: `1px solid ${active ? '#1e9fd2' : '#e8e8e8'}`,
                        background: active ? '#e6f5fa' : '#fff',
                        color: active ? '#055885' : '#595959',
                        fontSize: 14, fontWeight: active ? 600 : 500,
                        cursor: 'pointer', fontFamily: 'inherit',
                        whiteSpace: 'nowrap',
                      }}>
                      {labels[c] || c}
                    </button>
                  );
                })}
              </div>
            )}

            {/* 4-col grid (8cards visible, optionally expand) */}
            {displayed.length === 0 ? (
              <div style={{ background: '#fafafa', border: '1px dashed #d9d9d9', borderRadius: 8, padding: 48, textAlign: 'center', color: '#8c8c8c' }}>
                此分類目前沒有符合的Event
              </div>
            ) : (
              <div
                key={`${section.id}-${chip}-${showMore}`}
                className="seb-fade-in"
                style={{ display: 'grid', gridTemplateColumns: 'repeat(var(--seb-cols), 1fr)', gap: 16 }}>
                {displayed.map(e => <EventCard key={e.id} e={e} />)}
              </div>
            )}

            {/* Show more / less toggle */}
            {hiddenCount > 0 && !showMore && (
              <div style={{ display: 'flex', justifyContent: 'center', marginTop: 20 }}>
                <button
                  onClick={() => setShowMore(true)}
                  style={{
                    padding: '10px 24px', borderRadius: 4,
                    border: '1px solid #e8e8e8', background: '#fff',
                    color: '#262626', fontSize: 14, fontWeight: 500,
                    fontFamily: 'inherit', cursor: 'pointer',
                    display: 'inline-flex', alignItems: 'center', gap: 6,
                  }}>
                  ShowMore ({hiddenCount})
                  <span className="ay-icon ay-icon-line" style={{ fontSize: 18 }}>expand_more</span>
                </button>
              </div>
            )}
            {showMore && filtered.length > 6 && (
              <div style={{ display: 'flex', justifyContent: 'center', marginTop: 20 }}>
                <button
                  onClick={() => setShowMore(false)}
                  style={{
                    padding: '10px 24px', borderRadius: 4,
                    border: '1px solid #e8e8e8', background: '#fff',
                    color: '#262626', fontSize: 14, fontWeight: 500,
                    fontFamily: 'inherit', cursor: 'pointer',
                    display: 'inline-flex', alignItems: 'center', gap: 6,
                  }}>
                  Show更少
                  <span className="ay-icon ay-icon-line" style={{ fontSize: 18 }}>expand_less</span>
                </button>
              </div>
            )}
          </div>
        </section>
      );
    };

    Object.assign(window, { SectionGrid });

  </script>

  <script type="text/babel" data-presets="env,react">
    // SEB v4App — three-tier composition
    //
    //   mainTab  →  switches the entire content (sections + secondTabs)
    //   secondTab → anchor nav: smooth-scrolls to a Section
    //   Section  →  has its own chip filter + 8-card grid
    //
    // Anchor logic:
    //   - Click a secondTab → smooth-scroll to that section's element
    //   - Scrollspy → as user scrolls, whichever section is closest to the
    //     viewport top wins, updating active state on the secondTab bar.

    const { useState, useMemo, useRef, useEffect, useCallback } = React;

    // ── Currency conversion config ──
    window.__sebCurrencyConfig = {
      TWD: { symbol: 'NT$', divisor: 1 },
      USD: { symbol: 'USD$', divisor: 30 },
      RMB: { symbol: '¥', divisor: 5 },
    };

    function SebApp() {
      // Default to first available tab — works whether tabs are 'hot' (original)
      // or 'marathon' (Plan B variants).
      const [mainTab, setMainTab] = useState(() => window.SEB_MAIN_TABS?.[0]?.key || 'hot');
      const [activeSection, setActiveSection] = useState(null);
      const [notified, setNotified] = useState(new Set());
      // Currency state — TWD / USD / RMB. Init from cookie so a
      // locale-detect.js reload (after dropdown click) restores the choice.
      const [currency, setCurrency] = useState(() => {
        try {
          const m = document.cookie.match(/(?:^|;)\s*asiayo_currency=([^;]+)/);
          const v = m ? decodeURIComponent(m[1]).toUpperCase() : null;
          if (v === 'TWD' || v === 'USD' || v === 'RMB') return v;
        } catch (e) {}
        return 'USD';
      });
      window.__sebCurrency = currency;
      window.__sebSetCurrency = setCurrency;
      // Suppress scrollspy briefly after a click so it doesn't fight the
      // smooth-scroll animation.
      const suppressSpyUntilRef = useRef(0);

      const config = window.SEB_TAB_CONFIG[mainTab];
      const sections = config?.sections || [];

      // Reset active section to first when mainTab changes. Do NOT auto-scroll —
      // the user just wants the content to swap; their scroll position stays put.
      useEffect(() => {
        setActiveSection(sections[0]?.id || null);
      }, [mainTab]);

      // Scrollspy — find section closest to scroll line (just below sticky bars)
      useEffect(() => {
        const onScroll = () => {
          if (Date.now() < suppressSpyUntilRef.current) return;
          const scrollLine = 170; // sticky main tab bar approx
          const els = document.querySelectorAll('[data-section-id]');
          let best = null;
          let bestDist = Infinity;
          els.forEach(el => {
            const rect = el.getBoundingClientRect();
            // pick the section whose top is closest to (but not below) scrollLine
            const dist = Math.abs(rect.top - scrollLine);
            if (rect.bottom > scrollLine && dist < bestDist) {
              bestDist = dist;
              best = el.dataset.sectionId;
            }
          });
          if (best && best !== activeSection) setActiveSection(best);
        };
        window.addEventListener('scroll', onScroll, { passive: true });
        onScroll();
        return () => window.removeEventListener('scroll', onScroll);
      }, [activeSection, mainTab]);

      const handleSecondTabClick = useCallback((sectionId) => {
        const el = document.getElementById(sectionId);
        if (!el) return;
        setActiveSection(sectionId);
        suppressSpyUntilRef.current = Date.now() + 700;
        const top = el.getBoundingClientRect().top + window.scrollY - 170;
        window.scrollTo({ top, behavior: 'smooth' });
      }, []);

      const toggleNotify = (id) => {
        const s = new Set(notified);
        if (s.has(id)) s.delete(id); else s.add(id);
        setNotified(s);
      };

      return (
        <div data-screen-label="SEB Sport Activities v4">
          <SiteHeader />
          <Banner />
          <SebHeading />

          {/* Tier 1+ 2nav */}
          <FilterBarV4 mainTab={mainTab}
          setMainTab={setMainTab}
          activeSection={activeSection}
          onSecondTabClick={handleSecondTabClick}
          />

          {/* Sections — operator-defined per mainTab */}
          <div style={{ background: '#fff' }}>
            {sections.map(s => (
              <SectionGrid key={`${mainTab}-${s.id}`} section={s} mainTabKey={mainTab} />
            ))}
          </div>

          {/* Coming Soon — only visible when the 即將開放Register mainTab is active and has items */}
          {mainTab === 'coming' && window.SEB_COMING_SOON.length > 0 && (
            <section
              id="coming-soon"
              style={{ background: '#fff', padding: '40px var(--seb-pad) 64px' }}>
              <div style={{ maxWidth: '100%', margin: '0 auto' }}>
                <div style={{ marginBottom: 18 }}>
                  <h2 className="ay-h3" style={{ margin: 0, fontSize: 28, color: '#262626', letterSpacing: '-0.01em' }}>
                    即將開放Register
                    <span style={{ fontSize: 15, color: '#8c8c8c', fontWeight: 500, marginLeft: 10 }}>
                      {window.SEB_COMING_SOON.length} 場
                    </span>
                  </h2>
                  <p style={{ margin: '6px 0 0', fontSize: 14, color: '#595959' }}>PopularEvent即將開賣，搶先OpenNotification，第一Time掌握名額</p>
                </div>
                <div style={{ display: 'grid', gridTemplateColumns: 'repeat(var(--seb-cs-cols), 1fr)', gap: 16 }}>
                  {window.SEB_COMING_SOON.map(e => (
                    <ComingSoonCard key={e.id} e={e} onNotify={toggleNotify} notified={notified.has(e.id)} />
                  ))}
                </div>
              </div>
            </section>
          )}

          <WhyAsiaYo />
          <FAQSection />
          <ContactSection />
          <SiteFooter />
          <BackToTop />
        </div>
      );
    }

    // Floating back-to-top button — appears after the user scrolls 400px down.
    function BackToTop() {
      const [show, setShow] = React.useState(false);
      React.useEffect(() => {
        const onScroll = () => setShow(window.scrollY > 400);
        window.addEventListener('scroll', onScroll, { passive: true });
        onScroll();
        return () => window.removeEventListener('scroll', onScroll);
      }, []);
      return (
        <button
          onClick={() => window.scrollTo({ top: 0, behavior: 'smooth' })}
          aria-label="回到頂端"
          style={{
            position: 'fixed',
            right: 24,
            bottom: 24,
            width: 48,
            height: 48,
            borderRadius: '50%',
            border: '1px solid #e8e8e8',
            background: '#fff',
            boxShadow: '0 4px 12px rgba(0,0,0,.12)',
            cursor: 'pointer',
            display: 'flex',
            alignItems: 'center',
            justifyContent: 'center',
            color: '#262626',
            opacity: show ? 1 : 0,
            transform: show ? 'translateY(0)' : 'translateY(8px)',
            pointerEvents: show ? 'auto' : 'none',
            transition: 'opacity 200ms, transform 200ms, box-shadow 150ms',
            zIndex: 200,
          }}
          onMouseEnter={(e) => { e.currentTarget.style.boxShadow = '0 6px 16px rgba(0,0,0,.18)'; }}
          onMouseLeave={(e) => { e.currentTarget.style.boxShadow = '0 4px 12px rgba(0,0,0,.12)'; }}>
          <span className="ay-icon ay-icon-line" style={{ fontSize: 24 }}>arrow_upward</span>
        </button>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<SebApp />);

  </script>

  <script src="/locale-detect.js"></script>
</body>

</html>
